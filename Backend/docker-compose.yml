name: songoten

services:
  barar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Comma-separated China-friendly GitHub accelerators; empty = direct.
        GIT_MIRROR: ${GIT_MIRROR:-https://ghfast.top/,https://gh-proxy.com/,https://ghproxy.net/}
        REPO_URL: ${REPO_URL:-https://github.com/JHerculesqz/SonGoten.git}
        REPO_REF: ${REPO_REF:-master}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        UV_VERSION: ${UV_VERSION:-0.13.1}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        APT_MIRROR: ${APT_MIRROR:-}
        VERSION: ${BARAR_VERSION:-0.1.0}
    image: sungoten/barar:${BARAR_TAG:-latest}
    container_name: barar
    init: true
    restart: unless-stopped
    ports:
      - "${OCTOGAMEAR_HOST_PORT:-3501}:3501"
    environment:
      OCTOGAMEAR_HOST: 0.0.0.0
      OCTOGAMEAR_PORT: 3501
      OCTOGAMEAR_BASE_PATH: ${OCTOGAMEAR_BASE_PATH:-/octogame/barar}
      OCTOGAMEAR_WEB_DIR: /app/web
      OCTOGAMEAR_STREET_BASE_PATH: ${OCTOGAMEAR_STREET_BASE_PATH:-/octogame/barstreet}
      OCTOGAMEAR_STREET_WEB_DIR: /app/web-street
      OCTOGAMEAR_STREET_DB: /app/data/barstreet.sqlite3
      OCTOGAMEAR_STREET_STAFF_PIN: ${OCTOGAMEAR_STREET_STAFF_PIN:-8888}
      OCTOGAMEAR_STREET_SECRET: ${OCTOGAMEAR_STREET_SECRET:-}
      OCTOGAMEAR_STREET_MIN_SHIFT_SECONDS: ${OCTOGAMEAR_STREET_MIN_SHIFT_SECONDS:-20}
      OCTOGAMEAR_LOG_LEVEL: ${OCTOGAMEAR_LOG_LEVEL:-info}
    volumes:
      - barstreet-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  barstreet-data:
